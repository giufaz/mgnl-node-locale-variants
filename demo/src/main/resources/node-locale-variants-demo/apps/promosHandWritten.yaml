# Hand-written app on the promos workspace, mixing the two shapes Magnolia accepts for list properties: sections as a
# list (- name:), groups as a map, items as a list in one group and as a map in the other, rules as a list without
# names. subApps and actions must stay maps: Map2Bean leaves a map property null when given a list.
class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor
appClass: info.magnolia.ui.framework.app.BaseApp
label: Promos, hand-written (locale variants demo)
icon: icon-app
datasource:
  $type: jcrDatasource
  workspace: promos
  allowedNodeTypes:
    - mgnl:folder
    - lvd:promo
subApps:
  browser:
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    label: Promos
    actions:
      rename:
        label: Rename promo
        icon: icon-edit
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        availability:
          writePermissionRequired: true
          nodeTypes: [lvd:promo]
      export:
        label: Export promo
        icon: icon-export
        $type: exportAction
        format: YAML
        availability:
          nodeTypes: [lvd:promo]
          rules:                      # a list without names: rule definitions have no name
            - $type: jcrIsDeletedRule
              negate: true
    actionbar:
      sections:
        - name: item
          availability:
            nodeTypes: [lvd:promo]
          groups:
            editActions:
              items:
                - name: rename
            importExportActions:
              items:
                export: {}
    workbench:
      contentViews:
        - name: tree
          $type: treeView
          columns:
            - name: jcrName
              $type: jcrTitleColumn
              expandRatio: 2
            - name: jcrPublishingStatus
              $type: statusColumn
permissions:
  roles:
    superuser: superuser
