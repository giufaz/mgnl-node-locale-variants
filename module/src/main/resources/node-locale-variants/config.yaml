# Change it with a decoration: <your-module>/decorations/node-locale-variants/config.yaml

# Browser actions allowed on variants and containers (copy, move, duplicate, rename, paste are never allowed)
defaults:
  variantActions: [editItem, confirmMarkDeletion, markDeleted, activate, deactivate, export, showVersions, restoreVersion,
                   restorePreviousVersion, deletePermanently, activateDeleted]
  containerActions: [activate, deactivate, export, confirmMarkDeletion, markDeleted, activateDeleted, deletePermanently,
                     restorePreviousVersion]

# Per app: nodeTypes (required), enabled, variantActions / containerActions (added to the defaults),
# replaceDefaultVariantActions / replaceDefaultContainerActions (true = only the app's lists)
apps: {}
