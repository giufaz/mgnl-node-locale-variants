# Change it with a decoration: <your-module>/decorations/node-locale-variants/config.yaml

# Browser actions allowed on variants and containers (copy, move, duplicate, rename, paste are never allowed)
defaults:
  variantActions: [editItem, confirmMarkDeletion, markDeleted, activate, deactivate, export, showVersions, restoreVersion,
                   restorePreviousVersion, deletePermanently, activateDeleted]
  containerActions: [activate, deactivate, export, confirmMarkDeletion, markDeleted, activateDeleted, deletePermanently,
                     restorePreviousVersion]
  # If true, replace Magnolia's default restore action, with its more complete recursive one
  recursiveRestore: true

# Per app: nodeTypes (required), enabled, variantActions / containerActions (added to the defaults),
# replaceDefaultVariantActions / replaceDefaultContainerActions (true = only the app's lists)
apps:
  # Preset for the Pages app, off: turn it on with apps.pages-app.enabled: true
  # (not on page variants: change template, add page, import, publish incl. subpages)
  pages-app:
    enabled: false
    nodeTypes: [mgnl:page]
    replaceDefaultVariantActions: true
    variantActions: [preview, edit, editPage, publish, unpublish, export,
                     confirmMarkDeletion, markDeleted, deletePermanently, publishDeletion,
                     versionShow, versionRestore, restorePreviousVersion, showPreviousVersion]
    replaceDefaultContainerActions: true
    containerActions: [publish, unpublish, export,
                       confirmMarkDeletion, markDeleted, publishDeletion, deletePermanently, restorePreviousVersion]
